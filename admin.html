<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Alpi Taxi | Admin Control</title>
    
    <!-- Firebase SDKs (v8) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <style>
        :root {
            --primary: #d97706;
            --primary-hover: #b45309;
            --bg-color: #f8fafc;
            --surface: #ffffff;
            --text-main: #0f172a;
            --text-light: #64748b;
            --border-silver: 0.5px solid #c0c0c0;
            --shadow-silver: 0 2px 8px rgba(192, 192, 192, 0.35);
            --radius-md: 14px;
            --radius-sm: 8px;
            --transition: all 0.2s ease;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', -apple-system, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); line-height: 1.4; overflow-x: hidden; width: 100%; }
        img { max-width: 100%; display: block; object-fit: cover; }
        button, input, select, textarea { font-family: inherit; }

        /* 1. Header (ثابت وأنيق) */
        .admin-navbar {
            position: sticky; top: 0; z-index: 100;
            background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px);
            border-bottom: var(--border-silver); box-shadow: var(--shadow-silver);
            padding: 0.65rem 1rem; display: flex; justify-content: space-between; align-items: center;
        }
        .nav-brand { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 1.1rem; }
        .site-logo { width: 34px; height: 34px; border-radius: 50%; object-fit: contain; background: #fff; border: var(--border-silver); padding: 2px; }
        
        /* 2. Top Action Buttons (في نفس السطر) */
        .top-action-bar {
            display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 12px 0 16px;
        }
        
        .main-container { max-width: 1200px; margin: 0 auto; padding: 0 12px 30px; }

        /* Buttons */
        .btn {
            background: var(--primary); color: white; border: var(--border-silver); padding: 8px 12px;
            border-radius: var(--radius-sm); font-weight: 700; cursor: pointer; transition: var(--transition);
            display: inline-flex; align-items: center; justify-content: center; gap: 5px; font-size: 0.82rem;
            white-space: nowrap; text-align: center;
        }
        .btn:hover { background: var(--primary-hover); }
        .btn-danger { background: #ef4444; border-color: #dc2626; }
        .btn-danger:hover { background: #dc2626; }
        .btn-edit { background: #0284c7; border-color: #0369a1; }
        .btn-edit:hover { background: #0369a1; }
        .btn-secondary { background: #64748b; border-color: #475569; }

        /* 3. Horizontal Card Rows Layout */
        .section-box {
            background: var(--surface); padding: 14px; border-radius: var(--radius-md);
            border: var(--border-silver); box-shadow: var(--shadow-silver); margin-bottom: 18px;
        }
        .section-title { font-size: 1.1rem; font-weight: 800; margin-bottom: 12px; display: flex; align-items: center; gap: 6px; }

        /* Grid: 1 col on mobile, 2 cols on desktop */
        .cards-layout-grid {
            display: grid; grid-template-columns: 1fr; gap: 10px;
        }
        @media (min-width: 768px) {
            .cards-layout-grid { grid-template-columns: 1fr 1fr; gap: 14px; }
            .top-action-bar { max-width: 600px; }
            .main-container { padding: 0 16px 40px; }
        }

        /* الشكل المستطيل الأفقي للبطاقة */
        .admin-card-row {
            display: flex; align-items: center; justify-content: space-between; gap: 10px;
            background: var(--surface); border: var(--border-silver); border-radius: var(--radius-sm);
            padding: 8px 10px; box-shadow: 0 1px 4px rgba(0,0,0,0.03); transition: var(--transition);
            min-width: 0; width: 100%;
        }
        .admin-card-row:hover { border-color: var(--primary); box-shadow: var(--shadow-silver); }

        /* صورة البطاقة في أقصى اليمين/اليسار بدقة 400 */
        .card-thumb-img {
            width: 80px; height: 62px; border-radius: 6px; object-fit: cover;
            flex-shrink: 0; border: var(--border-silver);
        }

        /* تفاصيل البطاقة في نفس السطر */
        .card-middle-info {
            flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center;
        }
        .card-title-text {
            font-size: 0.88rem; font-weight: 700; color: var(--text-main);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .card-sub-detail {
            font-size: 0.75rem; color: var(--text-light); margin-top: 2px;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .card-price-pill {
            display: inline-block; color: var(--primary); font-weight: 800; font-size: 0.82rem; margin-top: 2px;
        }

        /* أزرار الإجراءات في نفس السطر */
        .card-actions-group {
            display: flex; align-items: center; gap: 5px; flex-shrink: 0;
        }
        .btn-icon {
            padding: 6px 9px; font-size: 0.75rem; border-radius: 6px;
        }

        /* 4. Internal In-Page Editor (الصفحة الداخلية) */
        .internal-page-view { display: none; }
        .editor-container {
            background: var(--surface); border-radius: var(--radius-md);
            border: var(--border-silver); box-shadow: var(--shadow-silver);
            padding: 16px; margin-top: 10px;
        }
        .editor-top-nav {
            display: flex; align-items: center; justify-content: space-between;
            border-bottom: var(--border-silver); padding-bottom: 10px; margin-bottom: 14px;
        }

        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 0.8rem; font-weight: 700; margin-bottom: 4px; color: var(--text-main); }
        .form-group input, .form-group textarea {
            width: 100%; padding: 8px 10px; border: var(--border-silver); border-radius: var(--radius-sm);
            font-size: 0.88rem; outline: none; background: #fff;
        }
        .form-group input:focus, .form-group textarea:focus { border-color: var(--primary); }

        /* Cloudinary Upload Inside Page */
        .cloudinary-upload-box {
            border: 1.5px dashed var(--primary); border-radius: var(--radius-sm); background: #fffbeb;
            padding: 12px; text-align: center; cursor: pointer; position: relative; margin-top: 4px;
        }
        .cloudinary-upload-box input[type="file"] { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; cursor: pointer; }
        .preview-img-display { width: 100%; height: 140px; border-radius: 6px; object-fit: cover; display: none; margin-top: 8px; border: var(--border-silver); }

        /* Tabs inside In-Page Editor */
        .lang-tab-bar { display: flex; gap: 5px; margin: 10px 0 12px; border-bottom: var(--border-silver); padding-bottom: 6px; }
        .tab-btn {
            background: #f1f5f9; border: var(--border-silver); padding: 4px 10px; border-radius: 50px;
            cursor: pointer; font-size: 0.75rem; font-weight: 700;
        }
        .tab-btn.active { background: var(--primary); color: white; border-color: var(--primary); }

        /* Login Screen */
        .login-wrapper { max-width: 380px; margin: 60px auto; padding: 0 12px; }
        .login-card {
            background: var(--surface); padding: 2rem 1.5rem; border-radius: var(--radius-md);
            border: var(--border-silver); box-shadow: var(--shadow-silver); text-align: center;
        }
    </style>
</head>
<body oncontextmenu="return false;">

    <!-- Navbar -->
    <header class="admin-navbar">
        <div class="nav-brand">
            <img src="https://res.cloudinary.com/dsxrjmcxs/image/upload/c_limit,w_400,q_auto,f_auto/v1786716325/ecuwdts2f0797fnddg4z.png" alt="Logo" class="site-logo">
            <span>Alpi Control</span>
        </div>
        <button id="logoutBtn" class="btn btn-danger" style="display:none; padding:5px 10px; font-size:0.75rem;" onclick="logout()">Abmelden</button>
    </header>

    <!-- 1. شاشة تسجيل الدخول -->
    <div class="login-wrapper" id="loginScreen">
        <div class="login-card">
            <h2 style="margin-bottom:12px; font-size:1.3rem;">Admin Login</h2>
            <div class="form-group">
                <label>E-Mail-Adresse</label>
                <input type="email" id="loginEmail" placeholder="admin@alpitaxi.com">
            </div>
            <div class="form-group">
                <label>Passwort</label>
                <input type="password" id="loginPassword" placeholder="••••••••">
            </div>
            <button class="btn" style="width:100%; margin-top:6px; padding:10px;" onclick="login()">Anmelden</button>
            <p id="errorMsg" style="color:#ef4444; font-size:0.8rem; margin-top:10px; font-weight:700;"></p>
        </div>
    </div>

    <!-- 2. الشاشة الرئيسية للوحة التحكم (List View) -->
    <main class="main-container" id="dashboardListScreen" style="display:none;">
        
        <!-- أزرار الإضافة في نفس السطر مباشرة تحت الهيدر -->
        <div class="top-action-bar">
            <button class="btn" onclick="openInternalEditor('vehicle', 'add')">🚗 + Fahrzeug</button>
            <button class="btn" onclick="openInternalEditor('dest', 'add')">📍 + Neue Route</button>
        </div>

        <!-- قسم الرحلات والوجهات -->
        <section class="section-box">
            <h2 class="section-title">📍 Reiseziele & Routen</h2>
            <div class="cards-layout-grid" id="destListContainer">
                <!-- يتم توليد البطاقات الأفقية هنا -->
            </div>
        </section>

        <!-- قسم السيارات والأسطول -->
        <section class="section-box">
            <h2 class="section-title">🚗 Fahrzeugflotte</h2>
            <div class="cards-layout-grid" id="fleetListContainer">
                <!-- يتم توليد بطاقات السيارات هنا -->
            </div>
        </section>

    </main>

    <!-- 3. صفحة التعديل والإضافة الداخلية (In-Page Internal View) -->
    <div class="main-container internal-page-view" id="editorScreen">
        <div class="editor-container">
            
            <div class="editor-top-nav">
                <h3 id="editorPageTitle" style="font-size:1.05rem;">Element bearbeiten</h3>
                <button class="btn btn-secondary" onclick="backToDashboard()">← Zurück (إلغاء)</button>
            </div>

            <input type="hidden" id="editDocId">
            <input type="hidden" id="editItemType"> <!-- 'dest' or 'vehicle' -->
            <input type="hidden" id="uploadedImageUrl">

            <!-- رفع الصور المباشر عبر Cloudinary -->
            <div class="form-group">
                <label>Foto (Aus Telefongalerie wählen)</label>
                <div class="cloudinary-upload-box">
                    <span id="uploadStatusText">📸 Klicken zum Auswählen</span>
                    <input type="file" accept="image/*" onchange="uploadToCloudinary(this)">
                </div>
                <img id="imagePreviewDisplay" class="preview-img-display">
            </div>

            <!-- حقول خاصة بالرحلات (تظهر فقط عند تعديل رحلة) -->
            <div id="destFieldsGroup">
                <div style="display:grid; grid-template-columns: 1fr 1fr; gap:8px;">
                    <div class="form-group">
                        <label>Abholort (Start)</label>
                        <input type="text" id="destFromInput" placeholder="z.B. Innsbruck Hbf">
                    </div>
                    <div class="form-group">
                        <label>Zielort (Ende)</label>
                        <input type="text" id="destToInput" placeholder="z.B. Bozen">
                    </div>
                </div>
                <div class="form-group">
                    <label>Preis (€ inkl. MwSt.)</label>
                    <input type="number" id="destPriceInput" placeholder="290">
                </div>
            </div>

            <!-- حقول خاصة بالسيارات (تظهر فقط عند تعديل سيارة) -->
            <div id="vehicleFieldsGroup" style="display:none;">
                <div style="display:grid; grid-template-columns: 1fr 1fr; gap:8px;">
                    <div class="form-group">
                        <label>Modellname</label>
                        <input type="text" id="vehicleNameInput" placeholder="z.B. Mercedes Vito">
                    </div>
                    <div class="form-group">
                        <label>Max. Personen</label>
                        <input type="number" id="vehiclePaxInput" placeholder="8">
                    </div>
                </div>
            </div>

            <!-- تبويبات اللغات الثلاث -->
            <label style="font-size:0.8rem; font-weight:700; display:block; margin-top:6px;">Texte & Übersetzungen:</label>
            <div class="lang-tab-bar">
                <div class="tab-btn active" onclick="switchLanguageTab('de')">🇩🇪 Deutsch</div>
                <div class="tab-btn" onclick="switchLanguageTab('en')">🇬🇧 English</div>
                <div class="tab-btn" onclick="switchLanguageTab('nl')">🇳🇱 Nederlands</div>
            </div>

            <!-- محتوى اللغات -->
            <div id="lang_de_box">
                <div class="form-group">
                    <label>Titel (DE)</label>
                    <input type="text" id="title_de_input" placeholder="Titel auf Deutsch">
                </div>
                <div class="form-group">
                    <label>Beschreibung (DE)</label>
                    <textarea id="desc_de_input" rows="2" placeholder="Beschreibung auf Deutsch"></textarea>
                </div>
            </div>

            <div id="lang_en_box" style="display:none;">
                <div class="form-group">
                    <label>Title (EN)</label>
                    <input type="text" id="title_en_input" placeholder="Title in English">
                </div>
                <div class="form-group">
                    <label>Description (EN)</label>
                    <textarea id="desc_en_input" rows="2" placeholder="Description in English"></textarea>
                </div>
            </div>

            <div id="lang_nl_box" style="display:none;">
                <div class="form-group">
                    <label>Titel (NL)</label>
                    <input type="text" id="title_nl_input" placeholder="Titel in het Nederlands">
                </div>
                <div class="form-group">
                    <label>Beschrijving (NL)</label>
                    <textarea id="desc_nl_input" rows="2" placeholder="Beschrijving in het Nederlands"></textarea>
                </div>
            </div>

            <button class="btn" style="width:100%; margin-top:12px; padding:10px; font-size:0.9rem;" onclick="saveItemData()">💾 Speichern (حفظ البيانات)</button>
        </div>
    </div>

    <!-- Script Logic -->
    <script>
        // 1. Firebase Initializing
        const firebaseConfig = {
            apiKey: "AIzaSyDFPkLo38na2qyc2TFu1jz1Fv3JN8QPvP0",
            authDomain: "alpi-taxi.firebaseapp.com",
            projectId: "alpi-taxi",
            storageBucket: "alpi-taxi.firebasestorage.app",
            messagingSenderId: "888640544054",
            appId: "1:888640544054:web:ad4975463f4b29fb682797",
            measurementId: "G-7SERGDFG8D"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // 2. Strict Security: Authorized UID Check
        const ADMIN_UID = "ryO484XxlBf3NpjGugipKMt2ZkM2";

        auth.onAuthStateChanged(user => {
            if(user) {
                if(user.uid === ADMIN_UID) {
                    document.getElementById('loginScreen').style.display = "none";
                    document.getElementById('dashboardListScreen').style.display = "block";
                    document.getElementById('logoutBtn').style.display = "inline-flex";
                    loadAllCards();
                } else {
                    alert("⛔ Zugriff verweigert: Sie sind nicht berechtigt!");
                    auth.signOut();
                }
            } else {
                document.getElementById('loginScreen').style.display = "block";
                document.getElementById('dashboardListScreen').style.display = "none";
                document.getElementById('editorScreen').style.display = "none";
                document.getElementById('logoutBtn').style.display = "none";
            }
        });

        function login() {
            const e = document.getElementById('loginEmail').value.trim();
            const p = document.getElementById('loginPassword').value;
            auth.signInWithEmailAndPassword(e, p).catch(err => {
                document.getElementById('errorMsg').innerText = "Fehler: " + err.message;
            });
        }

        function logout() { auth.signOut(); }

        // 3. Load Cards in Horizontal Rows Layout
        function loadAllCards() {
            // Destinations Realtime
            db.collection("destinations").onSnapshot(snap => {
                const container = document.getElementById('destListContainer');
                container.innerHTML = "";
                if(snap.empty) {
                    container.innerHTML = `<p style="font-size:0.8rem; color:gray;">Keine Routen vorhanden.</p>`;
                    return;
                }
                snap.forEach(doc => {
                    const d = doc.data();
                    // استخدام صورة مصغرة w_400
                    const imgUrl = d.imageUrl || "https://images.unsplash.com/photo-1436491865332-7a61a109cc05?auto=format&fit=crop&w=400&q=80";
                    
                    container.innerHTML += `
                        <div class="admin-card-row">
                            <img src="${imgUrl}" class="card-thumb-img">
                            <div class="card-middle-info">
                                <span class="card-title-text">${d.title_de || d.from + ' ➔ ' + d.to}</span>
                                <span class="card-sub-detail">${d.from} ➔ ${d.to}</span>
                                <span class="card-price-pill">€${d.price}</span>
                            </div>
                            <div class="card-actions-group">
                                <button class="btn btn-edit btn-icon" onclick="openInternalEditor('dest', 'edit', '${doc.id}')">✏️</button>
                                <button class="btn btn-danger btn-icon" onclick="deleteDocument('destinations', '${doc.id}')">🗑️</button>
                            </div>
                        </div>
                    `;
                });
            });

            // Fleet Realtime
            db.collection("vehicles").onSnapshot(snap => {
                const container = document.getElementById('fleetListContainer');
                container.innerHTML = "";
                if(snap.empty) {
                    container.innerHTML = `<p style="font-size:0.8rem; color:gray;">Keine Fahrzeuge vorhanden.</p>`;
                    return;
                }
                snap.forEach(doc => {
                    const d = doc.data();
                    const imgUrl = d.imageUrl || "https://res.cloudinary.com/dsxrjmcxs/image/upload/c_limit,w_400,q_auto,f_auto/v1786716414/bl2wzjvwiuocspelj562.png";
                    
                    container.innerHTML += `
                        <div class="admin-card-row">
                            <img src="${imgUrl}" class="card-thumb-img">
                            <div class="card-middle-info">
                                <span class="card-title-text">${d.name}</span>
                                <span class="card-sub-detail">Max. ${d.pax} Personen</span>
                            </div>
                            <div class="card-actions-group">
                                <button class="btn btn-edit btn-icon" onclick="openInternalEditor('vehicle', 'edit', '${doc.id}')">✏️</button>
                                <button class="btn btn-danger btn-icon" onclick="deleteDocument('vehicles', '${doc.id}')">🗑️</button>
                            </div>
                        </div>
                    `;
                });
            });
        }

        // 4. Internal View Switcher & On-Demand Fetching (تحميل تفاصيل العنصر عند الطلب لتخفيف الحمل)
        function openInternalEditor(type, mode, docId = "") {
            document.getElementById('dashboardListScreen').style.display = "none";
            document.getElementById('editorScreen').style.display = "block";
            window.scrollTo({ top: 0, behavior: 'smooth' });

            // ضبط الحقول
            document.getElementById('editDocId').value = docId;
            document.getElementById('editItemType').value = type;
            document.getElementById('uploadedImageUrl').value = "";
            document.getElementById('imagePreviewDisplay').style.display = "none";
            document.getElementById('uploadStatusText').innerText = "📸 Klicken zum Auswählen";

            // إظهار/إخفاء الحقول حسب النوع
            if(type === 'dest') {
                document.getElementById('destFieldsGroup').style.display = "block";
                document.getElementById('vehicleFieldsGroup').style.display = "none";
                document.getElementById('editorPageTitle').innerText = mode === 'edit' ? "Route bearbeiten (تعديل رحلة)" : "Neue Route anlegen (إضافة رحلة)";
            } else {
                document.getElementById('destFieldsGroup').style.display = "none";
                document.getElementById('vehicleFieldsGroup').style.display = "block";
                document.getElementById('editorPageTitle').innerText = mode === 'edit' ? "Fahrzeug bearbeiten (تعديل سيارة)" : "Neues Fahrzeug anlegen (إضافة سيارة)";
            }

            // تفريغ الحقول أولاً
            clearEditorInputs();

            // إذا كان تعديل، استدعاء تفاصيل البطاقة تحديداً من فيربس
            if(mode === 'edit' && docId) {
                const collection = type === 'dest' ? "destinations" : "vehicles";
                db.collection(collection).doc(docId).get().then(doc => {
                    if(!doc.exists) return;
                    const d = doc.data();
                    
                    if(type === 'dest') {
                        document.getElementById('destFromInput').value = d.from || "";
                        document.getElementById('destToInput').value = d.to || "";
                        document.getElementById('destPriceInput').value = d.price || "";
                    } else {
                        document.getElementById('vehicleNameInput').value = d.name || "";
                        document.getElementById('vehiclePaxInput').value = d.pax || 8;
                    }

                    document.getElementById('title_de_input').value = d.title_de || d.name || "";
                    document.getElementById('desc_de_input').value = d.desc_de || d.desc || "";
                    document.getElementById('title_en_input').value = d.title_en || "";
                    document.getElementById('desc_en_input').value = d.desc_en || "";
                    document.getElementById('title_nl_input').value = d.title_nl || "";
                    document.getElementById('desc_nl_input').value = d.desc_nl || "";

                    if(d.imageUrl) {
                        document.getElementById('uploadedImageUrl').value = d.imageUrl;
                        const preview = document.getElementById('imagePreviewDisplay');
                        preview.src = d.imageUrl;
                        preview.style.display = "block";
                    }
                });
            }
        }

        function backToDashboard() {
            document.getElementById('editorScreen').style.display = "none";
            document.getElementById('dashboardListScreen').style.display = "block";
        }

        function clearEditorInputs() {
            document.getElementById('destFromInput').value = "";
            document.getElementById('destToInput').value = "";
            document.getElementById('destPriceInput').value = "";
            document.getElementById('vehicleNameInput').value = "";
            document.getElementById('vehiclePaxInput').value = "8";
            document.getElementById('title_de_input').value = "";
            document.getElementById('desc_de_input').value = "";
            document.getElementById('title_en_input').value = "";
            document.getElementById('desc_en_input').value = "";
            document.getElementById('title_nl_input').value = "";
            document.getElementById('desc_nl_input').value = "";
        }

        // 5. Cloudinary Direct Upload
        async function uploadToCloudinary(fileInput) {
            const file = fileInput.files[0];
            if(!file) return;

            const status = document.getElementById('uploadStatusText');
            const preview = document.getElementById('imagePreviewDisplay');
            status.innerText = "⏳ Bild wird hochgeladen...";

            const formData = new FormData();
            formData.append("file", file);
            formData.append("upload_preset", "My_public_preset");

            try {
                const res = await fetch("https://api.cloudinary.com/v1_1/dsxrjmcxs/image/upload", {
                    method: "POST",
                    body: formData
                });
                const data = await res.json();
                if(data.secure_url) {
                    document.getElementById('uploadedImageUrl').value = data.secure_url;
                    preview.src = data.secure_url;
                    preview.style.display = "block";
                    status.innerText = "✅ Bild bereit (Ändern?)";
                } else {
                    alert("Fehler beim Upload!");
                    status.innerText = "❌ Fehler beim Upload";
                }
            } catch(e) {
                alert("Verbindungsfehler!");
                status.innerText = "❌ Verbindungsfehler";
            }
        }

        // 6. Save & Update Logic
        function saveItemData() {
            const type = document.getElementById('editItemType').value;
            const docId = document.getElementById('editDocId').value;
            const imageUrl = document.getElementById('uploadedImageUrl').value;

            const title_de = document.getElementById('title_de_input').value.trim();
            const desc_de = document.getElementById('desc_de_input').value.trim();
            const title_en = document.getElementById('title_en_input').value.trim() || title_de;
            const desc_en = document.getElementById('desc_en_input').value.trim() || desc_de;
            const title_nl = document.getElementById('title_nl_input').value.trim() || title_de;
            const desc_nl = document.getElementById('desc_nl_input').value.trim() || desc_de;

            if(type === 'dest') {
                const from = document.getElementById('destFromInput').value.trim();
                const to = document.getElementById('destToInput').value.trim();
                const price = parseInt(document.getElementById('destPriceInput').value);

                if(!from || !to || isNaN(price)) {
                    alert("Bitte Startort, Zielort und Preis ausfüllen!");
                    return;
                }

                const data = { from, to, price, imageUrl, title_de: title_de || `${from} ➔ ${to}`, desc_de, title_en, desc_en, title_nl, desc_nl };
                const req = docId ? db.collection("destinations").doc(docId).update(data) : db.collection("destinations").add(data);
                req.then(() => backToDashboard());
            } else {
                const name = document.getElementById('vehicleNameInput').value.trim();
                const pax = parseInt(document.getElementById('vehiclePaxInput').value);

                if(!name || isNaN(pax)) {
                    alert("Bitte Modellname und Passagieranzahl angeben!");
                    return;
                }

                const data = { name, pax, imageUrl, desc_de, desc_en, desc_nl };
                const req = docId ? db.collection("vehicles").doc(docId).update(data) : db.collection("vehicles").add(data);
                req.then(() => backToDashboard());
            }
        }

        // 7. Delete Document
        function deleteDocument(col, id) {
            if(confirm("Möchten Sie diesen Eintrag wirklich löschen?")) {
                db.collection(col).doc(id).delete();
            }
        }

        // 8. Language Tabs Switching inside Editor
        function switchLanguageTab(lang) {
            document.querySelectorAll('[id^="lang_"]').forEach(el => el.style.display = "none");
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(`lang_${lang}_box`).style.display = "block";
            event.target.classList.add('active');
        }

        // 9. Anti-Inspect
        document.onkeydown = function(e) {
            if (e.keyCode == 123) return false;
            if (e.ctrlKey && e.shiftKey && (e.keyCode == 'I'.charCodeAt(0) || e.keyCode == 'J'.charCodeAt(0))) return false;
        };
    </script>
</body>
